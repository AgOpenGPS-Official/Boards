; PlatformIO build of the Arduino sketch in this folder.
; The same folder also opens directly in the Arduino IDE (see README.md).

[platformio]
src_dir = .
default_envs = waveshare_s3_8di8ro

[env:waveshare_s3_8di8ro]
platform = espressif32@^6
framework = arduino
board = esp32-s3-devkitc-1
; ESP32-S3-WROOM-1U-N16R8: 16MB QIO flash, 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = app3M_fat9M_16MB.csv
; only the sketch files at the top level, not .pio/
build_src_filter = +<*.ino> +<*.cpp> +<*.h>
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
